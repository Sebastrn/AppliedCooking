modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.appliedcooking]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "ae2"
type = "required"
versionRange = "[17,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "cookingforblockheads"
type = "required"
versionRange = "[18,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "balm"
type = "required"
versionRange = "[9,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "patchouli"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Soft integrations, discovered by each mod's own plugin system (Jade @WailaPlugin, JEI @JeiPlugin)
# or via IMC guarded by Balm.isModLoaded (TOP). Declared optional only for documentation + load order.
