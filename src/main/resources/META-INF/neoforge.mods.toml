modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.appliedcooking]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "ae2"
type = "required"
versionRange = "[26,)"
ordering = "AFTER"
side = "BOTH"

# CFB's crafting handler returns recipe remainders through IngredientToken.restore() (since 21.1.7, and standard
# throughout the 26.1.x line). Our provider relies on that: it does not return remainders itself, because doing so
# on top of CFB's would insert every one of them twice.
[[dependencies.appliedcooking]]
modId = "cookingforblockheads"
type = "required"
versionRange = "[26,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "balm"
type = "required"
versionRange = "[26,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appliedcooking]]
modId = "patchouli"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Soft integrations — discovered by each mod's own plugin system (Jade @WailaPlugin, JEI @JeiPlugin).
# Declared optional only for documentation + load order.
[[dependencies.appliedcooking]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# The One Probe has no 26.1 build — integration commented out for 26.1.2 (re-add this block when TOP ships for 26.1).
# [[dependencies.appliedcooking]]
# modId = "theoneprobe"
# type = "optional"
# versionRange = "*"
# ordering = "AFTER"
# side = "BOTH"

[[dependencies.appliedcooking]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
