plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'modmaven (Applied Energistics 2)'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'TwelveIterations (Balm, Cooking for Blockheads)'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
    }
    maven {
        name = 'k-4u (The One Probe)'
        url = 'https://maven.k-4u.nl'
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (Patchouli)'
        url = 'https://maven.blamejared.com'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Core integrations (compile + dev runtime)
    implementation "appeng:appliedenergistics2-neoforge:${ae2_version}"
    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    implementation "net.blay09.mods:cookingforblockheads-neoforge:${cfb_version}"

    // Optional HUD integrations (compile only; loaded if present at runtime)
    compileOnly "mcjty.theoneprobe:theoneprobe:${top_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Patchouli — optional, powers the in-game guide book. Resources only (no code dependency),
    // so it is only needed at runtime; pulled into the dev client here.
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
