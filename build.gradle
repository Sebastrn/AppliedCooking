plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.modrinth.minotaur' version '2.9.0'
    // CurseForgeGradle stays on 1.1.28: every release from 1.2.30 up needs a Java 25 JVM to even resolve, and
    // this toolchain is Java 21. Moving to 1.21.1 freed Minotaur (2.8.10 -> 2.9.0) but not this one. 1.1.28 has
    // everything the publish block uses — addEnvironment/addModLoader/addGameVersion/addRequirement/addOptional.
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // Applied Energistics 2 (+ its GuideME dependency) publish to Maven Central as of 1.21.1 —
    // group org.appliedenergistics. The old modmaven.dev host has no 1.21.1 build, so it's gone.
    maven {
        name = 'TwelveIterations (Balm)'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
    }
    maven {
        name = 'k-4u (The One Probe)'
        url = 'https://maven.k-4u.nl'
    }
    maven {
        name = 'Modrinth (Cooking for Blockheads, Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (Patchouli, JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'FTB (dev test mods)'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury (transitive dep of FTB Library)'
        url = 'https://maven.architectury.dev/'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Core integrations (compile + dev runtime)
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    implementation "maven.modrinth:cooking-for-blockheads:${cfb_version}"

    // Optional integrations — compiled against and loaded in the dev client so they can be tested. The mod
    // still runs without them: the TOP addon is guarded by Balm.isModLoaded, and the Jade @WailaPlugin / JEI
    // @JeiPlugin classes are only loaded by each mod's own plugin scan when that mod is present.
    implementation "mcjty.theoneprobe:theoneprobe:${top_version}"
    implementation "maven.modrinth:jade:${jade_version}"
    implementation "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // Patchouli — optional, powers the in-game guide book. Resources only (no code dependency),
    // so it is only needed at runtime; pulled into the dev client here.
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Dev-only test mods — loaded in the dev client to make debugging easier. Not shipped.
    // (JEI moved up to the optional integrations above now that we ship a JEI plugin.)
    // FTB Library pulls Architectury (11.1.17) transitively via its POM.
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"

    // Pam's HarvestCraft 2 — piles of extra food recipes to exercise the kitchen. Food Core is the
    // base; Crops/Trees/Food Extended build on it. (Croptopia has no NeoForge 1.20.4 build, so it's omitted.)
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-core:${harvestcraft_foodcore_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-crops:${harvestcraft_crops_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-trees:${harvestcraft_trees_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-extended:${harvestcraft_foodextended_version}"

    // Power-generation / tech test mods — a network power source to exercise the Kitchen Station's power draw
    // (e.g. Mekanism Generators or SolarFlux panels feeding an AE2 Energy Acceptor). The Mekanism suite is
    // base + generators + tools + additions (each module needs the base).
    runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_generators_version}"
    runtimeOnly "maven.modrinth:mekanism-tools:${mekanism_tools_version}"
    runtimeOnly "maven.modrinth:mekanism-additions:${mekanism_additions_version}"

    // SolarFlux Reborn (+ HammerLib, its required dep — the Modrinth maven doesn't pull it transitively) are scoped
    // to the CLIENT run only. HammerLib aborts a dedicated server on startup with
    //   IllegalArgumentException: class org.zeith.hammerlib.proxy.HLCommonProxy has no @SubscribeEvent methods,
    //   but register was called anyway
    // which broke `runServer` entirely. MDG gives each run its own classpath, so the client still gets solar panels
    // while the server stays loadable; Mekanism Generators covers power testing on both.
    clientAdditionalRuntimeClasspath "maven.modrinth:solar-flux-reborn:${solarflux_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:hammer-lib:${hammerlib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Publishing to Modrinth + CurseForge ------------------------------------------------------
// Run manually (e.g. from IntelliJ's Gradle tool window, or the CLI):
//   ./gradlew modrinth            -> Modrinth
//   ./gradlew publishCurseForge   -> CurseForge
//   ./gradlew modrinth publishCurseForge   -> both
// Tokens are read from ~/.gradle/gradle.properties (MODRINTH_TOKEN / CURSEFORGE_TOKEN) or the
// matching environment variables — NEVER commit them. Project ids live in gradle.properties.
// Tip: `modrinth { debugMode = true }` (or `--stacktrace`) to dry-run Modrinth without uploading.

// Publish only the section for the version being released. Modrinth and CurseForge render a changelog per file, so
// uploading the whole CHANGELOG.md would repeat every past release on every version's page and grow forever. The full
// history stays in CHANGELOG.md in the repo. Preview what will be sent with: ./gradlew printChangelog
def changelogFor(File file, String version) {
    if (!file.exists()) {
        return 'See the project page for the changelog.'
    }
    def wanted = ~('^##\\s+' + java.util.regex.Pattern.quote(version) + '\\s*$')
    def collected = []
    def inSection = false
    for (String line : file.readLines('UTF-8')) {
        if (line.startsWith('## ')) {
            if (inSection) {
                break // reached the next version — stop
            }
            inSection = wanted.matcher(line.trim()).matches()
            continue // never include the heading itself; the platform already shows the version
        }
        if (inSection) {
            collected << line
        }
    }
    def text = collected.join('\n').trim()
    return text ?: 'See the project page for the changelog.'
}

def changelogText = changelogFor(rootProject.file('CHANGELOG.md'), mod_version.toString())

tasks.register('printChangelog') {
    group = 'publishing'
    description = 'Prints the changelog section that would be published for the current version.'
    doLast {
        println "--- changelog to publish for ${mod_version} ---"
        println changelogText
        println '--- end ---'
    }
}

modrinth {
    token = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_id
    versionNumber = mod_version
    versionName = mod_version
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['1.21.1']
    loaders = ['neoforge']
    changelog = changelogText
    // Modrinth project slugs (adjust if a publish fails on an unknown project):
    dependencies {
        required.project 'ae2'
        required.project 'cooking-for-blockheads'
        required.project 'balm'
        optional.project 'patchouli'
        optional.project 'jade'
        optional.project 'the-one-probe'
        optional.project 'jei'
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads the built jar to CurseForge.'
    apiToken = findProperty('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_TOKEN')

    def mainFile = upload(curseforge_id, tasks.named('jar'))
    // displayName left unset on purpose -> CurseForge shows the jar's file name (appliedcooking-<version>.jar).
    mainFile.releaseType = 'release'
    mainFile.addGameVersion '1.21.1'
    mainFile.addModLoader 'NeoForge'
    mainFile.addEnvironment 'Client', 'Server'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    // CurseForge project slugs (adjust if a publish fails on an unknown project):
    mainFile.addRequirement 'applied-energistics-2', 'cooking-for-blockheads', 'balm'
    mainFile.addOptional 'patchouli', 'jade', 'the-one-probe', 'jei'
}
