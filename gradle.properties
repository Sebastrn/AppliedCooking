# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.4
minecraft_version_range=[1.20.4,1.21)
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neo_version=20.4.251
neo_version_range=[20.4,)
# FML loader version range (javafml)
loader_version_range=[1,)

## Mod Properties
mod_id=appliedcooking
mod_name=Applied Cooking
mod_license=MIT
mod_version=4.0.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=A mod to bridge Cooking For Blockheads with Applied Energistics 2

