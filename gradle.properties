mod_description=A mod to bridge Cooking For Blockheads with Applied Energistics 2

## Dependency versions (NeoForge 1.21.1 builds)
# AE2 moved to Maven Central at 1.21.1: the group is now org.appliedenergistics and the artifact dropped
# its -neoforge suffix. The old appeng:appliedenergistics2-neoforge on modmaven.dev stops at 19.0.4-alpha
# and has no 1.21.1 build. AE2 pulls GuideME (org.appliedenergistics:guideme:21.1.1) transitively.
ae2_version=19.2.17
balm_version=21.0.63+1.21.1
# CFB: Modrinth version id for 21.1.24 (neoforge 1.21.1). The TwelveIterations maven never published a
# +1.21.1 build past 21.1.9, so the id is pinned here — same reason as Jade below. Balm is declared
# explicitly above, so the Modrinth jar's lack of a POM costs us nothing.
cfb_version=MQCIy6VF
top_version=1.21_neo-12.0.8-7
# Jade: Modrinth version id for the NeoForge 1.21.1 build (Jade 15.10.5, official-mapped).
# The version *number* collides with the Fabric (intermediary-mapped) file, so pin the id.
jade_version=yd8FKCmx
patchouli_version=1.21.1-93-NEOFORGE
jei_version=19.39.0.368
# REI + EMI: the other two recipe viewers, each gets the same Kitchen Station info page as JEI (compat/rei, compat/emi).
# REI compiles against its full jar (the info-page entry point isn't in -api); EMI against its -api classifier.
rei_version=16.0.799
emi_version=1.1.24+1.21.1

