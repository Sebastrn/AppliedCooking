# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# Minecraft moved to a year.release.patch scheme (26.1.2) and NeoForge went 4-segment (26.1.2.<build>). Deps declare
# FLOORS: RS2 [26.1.2.74,), AE2 [26.1.2.21-beta,), GuideME [26.1.2.10-beta,). We build against 26.1.2.74 — the
# highest floor, a clean (non-beta) release that actually resolves. (The metadata lists .79-.82 but those POMs 404 —
# ahead of deployment; .74 is the newest confirmed-resolvable, and satisfies RS2 exactly.) A floor, not a pin.
neo_version=26.1.2.74
neo_version_range=[26.1,)
# FML loader version range (javafml)
loader_version_range=[1,)

## Publishing project ids (tokens go in ~/.gradle/gradle.properties, NOT here)
curseforge_id=689579
modrinth_id=BmMjyidG

## Mod Properties
mod_id=appliedcooking
mod_name=Applied Cooking
mod_license=MIT
mod_version=7.1.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=A mod to bridge Cooking For Blockheads with Applied Energistics 2

## Dependency versions (NeoForge 26.1.2 builds)
# AE2 publishes to Maven Central (group org.appliedenergistics, artifact appliedenergistics2) and pulls GuideME
# (org.appliedenergistics:guideme) transitively at runtime scope. 26.1.10-beta is the newest neoforge build for
# MC 26.1.2 (Modrinth-confirmed).
ae2_version=26.1.10-beta
# Balm AND CFB now publish clean 26.x versions to the TwelveIterations maven (net.blay09.mods:*-neoforge), so CFB
# no longer needs the Modrinth-id pin it used at 1.21.1 — the metadata lists real 26.1.2.x releases.
balm_version=26.1.2.9
cfb_version=26.1.2.3
# The One Probe has NO 26.1 build — McJty's k-4u maven ends at 1.21_neo-12.0.8-7 and the repo has no 26.x branch.
# The TOP integration is COMMENTED OUT for 26.1.2 (see TheOneProbeAddon.java + build.gradle). Re-add when TOP ships.
# top_version=
# Jade: Modrinth version id for the NeoForge 26.1.2 build (26.1.8+neoforge). The version *number* collides with the
# Fabric (intermediary-mapped) file, so pin the id — same as 1.21.1.
jade_version=gWlwZzoj
# Patchouli: Modrinth version id for the 26.1 NeoForge build (26.1-94-beta). BlameJared has NO 26.1 build; Modrinth
# does. Resources only (runtimeOnly), so the Modrinth jar's missing POM costs nothing.
patchouli_version=2CsnFLom
# JEI: artifact is jei-26.1.2-neoforge (must match the exact MC patch, NOT jei-26.1-neoforge — that one declares
# minecraft [26.1,26.1] and is rejected on 26.1.2). AE2 26.1.10-beta also requires jei [29.5.0.26,), so pin the
# latest 26.1.2 build. 29.2.0.x is the 26.1.0 line and fails both checks.
jei_version=29.16.0.47
# REI: the other recipe viewer available on 26.1 (EMI has no 26.1 build). Same Kitchen Station info page as JEI
# (compat/rei). Compiled against its full jar — the info-page entry point (BuiltinClientPlugin) isn't in REI's -api.
rei_version=26.1.819

