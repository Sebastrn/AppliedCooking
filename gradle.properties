# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# AE2 builds against 21.1.169 and declares [21.1.169,), so anything from 169 up satisfies it. We deliberately
# sit above that floor: The One Probe registers ModConfigEvent (a mod-bus event) on the game bus, which 21.1.169
# rejects outright and aborts the server — every TOP 1.21_neo build has this, so no TOP runs on 169. Later
# NeoForge routes it instead. Mekanism 10.7.15.81+ independently requires [21.1.194,). 21.1.238 is verified to
# load the full dev stack. AC itself uses no NeoForge API newer than 21.1.0.
neo_version=21.1.238
neo_version_range=[21.1,)
# FML loader version range (javafml)
loader_version_range=[1,)

## Publishing project ids (tokens go in ~/.gradle/gradle.properties, NOT here)
curseforge_id=689579
modrinth_id=BmMjyidG

## Mod Properties
mod_id=appliedcooking
mod_name=Applied Cooking
mod_license=MIT
mod_version=6.2.0
mod_group_id=sebastrn
